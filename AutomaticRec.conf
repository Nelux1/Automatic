# Optional config for AutomaticRec.sh (sourced at startup)
# Set your API keys or defaults here.
#
# Si instalaste con Install_requirements.sh, la copia activa suele estar en:
#   /opt/AutomaticRec/AutomaticRec.conf  (sudo para editar)
# También se carga sin sudo (y tiene prioridad):
#   ~/.config/automaticrec.conf
#
# La key real va en ese archivo, no acá (este conf está en el repo).
# Example:
# CHAOS_KEY="your_chaos_api_key_here"
